<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181c26"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="35%" stop-color="#dfb07a"/>
      <stop offset="70%" stop-color="#c4955b"/>
      <stop offset="100%" stop-color="#f5d6a8"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#goldGlow)"/>
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Decorative Sparkle Top Right -->
  <path d="M375 125 Q375 145 395 145 Q375 145 375 165 Q375 145 355 145 Q375 145 375 125 Z" fill="url(#goldGrad)"/>
  <!-- Decorative Sparkle Bottom Left -->
  <path d="M135 365 Q135 377 147 377 Q135 377 135 389 Q135 377 123 377 Q135 377 135 365 Z" fill="url(#goldGrad)"/>

  <!-- "Ella" Text in Gold -->
  <text x="256" y="295" 
        font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" 
        font-size="160" 
        font-weight="700" 
        font-style="italic" 
        letter-spacing="2" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.8))">
    Ella
  </text>
  
  <!-- Dot / Accent -->
  <circle cx="395" cy="290" r="10" fill="url(#goldGrad)"/>
</svg>